[package]
name = "cargo-crate-split"
version = "0.2.0"
edition = "2021"
description = "Analyze a Rust crate's module graph and propose a provably-acyclic split into workspace crates, with per-cut refactor suggestions and a CI architecture-fitness guard."
license = "MIT OR Apache-2.0"
repository = "https://github.com/zenide/cargo-crate-split"
readme = "README.md"
keywords = ["cargo", "refactoring", "crates", "workspace", "modules"]
categories = ["development-tools::cargo-plugins"]
exclude = [".idea", "target"]

[[bin]]
name = "cargo-crate-split"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
walkdir = "2"
petgraph = "0.6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
